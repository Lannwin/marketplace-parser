name: Jules AI Agent
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  jules-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Invoke Jules Agent
        uses: google-labs-code/jules-invoke@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
